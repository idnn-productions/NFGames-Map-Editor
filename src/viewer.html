<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>model review</title>
<script type="importmap">/*@importmap*/</script>
<style>
:root { color-scheme: dark; --bg: #14171d; --panel: #1c2029; --line: #2c3240; --text: #d8dee9; --dim: #8a93a6; --accent: #ffb366; --ok: #6fcf97; --bad: #ff7a7a; }
* { box-sizing: border-box; } [hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.45 ui-sans-serif, system-ui, sans-serif; }
body { display: grid; grid-template-columns: 260px 1fr 340px; grid-template-rows: 40px 1fr; height: 100vh; }
/* inside the workbench (a tab) the workbench's top bar is the only one */
body.framed { grid-template-rows: 1fr; } body.framed > header { display: none; } body.framed { grid-template-columns: 260px 1fr; } body.framed.lent-side { grid-template-columns: 1fr; } body.framed #right { display: none; }
#review, #reviews { background: var(--panel); padding: 0 12px 20px; } #review h2:first-child { margin-top: 4px; }
header { grid-column: 1 / 4; display: flex; align-items: center; gap: 12px; padding: 0 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 14px; margin: 0; font-weight: 600; } header .grow { flex: 1; } header a { color: var(--dim); }
aside { overflow: auto; background: var(--panel); border-right: 1px solid var(--line); padding: 10px; }
#right { border-right: 0; border-left: 1px solid var(--line); }
main { display: flex; min-width: 0; overflow: hidden; }
#main { position: relative; flex: 1; min-width: 0; overflow: hidden; }
#view { display: block; width: 100%; height: 100%; }
button, select, input, textarea { font: inherit; color: var(--text); background: #252a35; border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
button { cursor: pointer; } button:disabled { opacity: .45; cursor: default; } button.on { border-color: var(--accent); color: var(--accent); }
button.primary { background: var(--accent); color: #1a1206; border-color: var(--accent); font-weight: 600; }
textarea { width: 100%; resize: vertical; min-height: 48px; } select { width: 100%; }
.dim { color: var(--dim); } .bad { color: var(--bad); } .ok { color: var(--ok); }
h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 14px 0 6px; }
#filter { width: 100%; margin-bottom: 8px; } #newModel { width: 100%; margin-bottom: 8px; }
.draft-step { color: var(--dim); font-size: 11px; margin-left: 6px; }
.model { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 3px 6px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.model:hover { background: #252a35; } .model.current { background: #33291c; color: var(--accent); }
.pin { border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin: 8px 0; }
.pin.drop { border-color: var(--accent); }
.pin .head { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
.pin .num { background: var(--accent); color: #1a1206; border-radius: 50%; width: 20px; height: 20px; display: grid; place-items: center; font-weight: 700; font-size: 11px; flex: none; }
.pin .where { flex: 1; font-size: 11px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.refs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.refs figure { margin: 0; position: relative; }
.refs img { width: 56px; height: 56px; object-fit: cover; border-radius: 4px; border: 1px solid var(--line); cursor: zoom-in; }
.refs button { position: absolute; top: -7px; right: -7px; padding: 0 5px; font-size: 11px; border-radius: 50%; }
.job { border-top: 1px solid var(--line); padding: 6px 0; }
.state { font-size: 11px; padding: 1px 6px; border-radius: 8px; border: 1px solid var(--line); }
.state.done { color: var(--ok); border-color: var(--ok); } .state.failed, .state.unknown { color: var(--bad); border-color: var(--bad); }
.state.working, .state.needs-input { color: var(--accent); border-color: var(--accent); }
#overlay { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; color: var(--dim); text-align: center; padding: 20px; }
#overlay > div { pointer-events: auto; max-width: 440px; } #overlay h2 { font-size: 14px; color: var(--text); text-transform: none; letter-spacing: 0; }
#toolbar { position: absolute; top: 10px; left: 10px; display: flex; gap: 6px; flex-wrap: wrap; max-width: calc(100% - 20px); z-index: 2; } #toolbar select { width: auto; }
#status { position: absolute; bottom: 8px; left: 10px; font-size: 12px; }
#zoom { position: fixed; inset: 0; background: rgba(0, 0, 0, .8); display: none; place-items: center; z-index: 9; cursor: zoom-out; }
#zoom img { max-width: 90vw; max-height: 90vh; }
#main.pinning #view { cursor: crosshair; }
/* floating inspector cards (Stats and Materials) at top-right of the 3D view, and bottom dock (References + Animation) */
#inspectDock { position: absolute; top: 46px; right: 10px; width: 256px; max-height: calc(100% - 110px); display: flex; flex-direction: column; gap: 8px; z-index: 3; pointer-events: none; }
.hud-card { pointer-events: auto; background: rgba(28, 32, 41, .92); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; overflow: auto; }
.hud-card .hud-head { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
.hud-card .hud-head h2 { margin: 0; flex: 1; }
.hud-card .hud-head button { padding: 1px 6px; font-size: 11px; }
#statsTable { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
#statsTable td { padding: 2px 0; vertical-align: top; }
#statsTable td:first-child { color: var(--dim); padding-right: 8px; white-space: nowrap; }
#statsTable td:last-child { text-align: right; word-break: break-word; }
#matsList { display: flex; flex-direction: column; gap: 4px; max-height: 280px; overflow: auto; }
.mat-row { display: grid; grid-template-columns: 24px 1fr auto auto; align-items: center; gap: 6px; padding: 3px 4px; border-radius: 5px; border: 1px solid transparent; }
.mat-row:hover { background: #252a35; }
.mat-row.solo { border-color: var(--accent); background: #33291c; }
.mat-row input[type=color] { width: 22px; height: 22px; padding: 0; border: 1px solid var(--line); border-radius: 4px; background: none; cursor: pointer; }
.mat-row .mat-name { min-width: 0; text-align: left; border: 0; background: none; padding: 0; display: flex; flex-direction: column; cursor: pointer; }
.mat-row .mat-name b { font-weight: 500; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mat-row .mat-name span { font-size: 10px; color: var(--dim); font-variant-numeric: tabular-nums; }
.mat-row .mat-btn { padding: 1px 5px; font-size: 11px; }
#bottomDock { position: absolute; left: 10px; right: 10px; bottom: 28px; display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; pointer-events: none; z-index: 2; }
/* the model's own reference images: a strip of thumbnails over the foot of the 3D view, and one of them large beside it */
#modelRefs { pointer-events: auto; min-width: 0; max-width: 60%; background: rgba(28, 32, 41, .9); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px 6px; }
#modelRefs h2 { margin: 0; cursor: pointer; user-select: none; } #modelRefs.closed .strip { display: none; }
#modelRefs .strip { display: flex; gap: 6px; overflow-x: auto; margin-top: 4px; }
/* animation playback bar: shown automatically when a .glb or .fbx carries animation clips */
#animBar { pointer-events: auto; margin-left: auto; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; max-width: 100%; background: rgba(28, 32, 41, .92); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; font-size: 12px; }
#animBar select { width: auto; max-width: 170px; padding: 2px 6px; font-size: 12px; }
#animBar button { padding: 2px 7px; font-size: 12px; }
#animBar input[type=range] { width: 130px; padding: 0; accent-color: var(--accent); cursor: pointer; }
#animTime { font-variant-numeric: tabular-nums; color: var(--dim); min-width: 78px; text-align: right; }
.mref { flex: none; display: grid; justify-items: center; gap: 1px; padding: 3px; background: none; border: 1px solid transparent; font-size: 11px; color: var(--dim); }
.mref img { display: block; width: 56px; height: 56px; object-fit: cover; border-radius: 4px; border: 1px solid var(--line); background: #252a35; }
.mref span { max-width: 62px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mref:hover span { color: var(--text); } .mref.on { border-color: var(--accent); } .mref.on span { color: var(--accent); }
#refPanel { position: relative; flex: none; width: 42%; min-width: 180px; display: flex; flex-direction: column; background: var(--panel); border-left: 1px solid var(--line); }
#refPanel .bar { display: flex; align-items: center; gap: 6px; padding: 6px 8px 6px 12px; border-bottom: 1px solid var(--line); }
#refPanel .bar b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } #refPanel .bar .grow { flex: 1; }
#refPanel .pic { flex: 1; min-height: 0; display: flex; gap: 10px; align-items: center; justify-content: center; padding: 8px; }
#refPanel .pic img { max-width: 100%; max-height: 100%; object-fit: contain; cursor: zoom-in; }
#refPanel .pic figure { flex: 1 1 0; min-width: 0; max-height: 100%; margin: 0; display: grid; justify-items: center; gap: 4px; } #refPanel .pic figcaption { font-size: 11px; color: var(--dim); text-align: center; }
#refPanel .pic figure img { max-width: 100%; max-height: calc(100% - 20px); }
/* the match panel: scores per view, the target slider */
#match table { width: 100%; border-collapse: collapse; margin: 6px 0; font-variant-numeric: tabular-nums; } #match td, #match th { padding: 2px 4px; text-align: right; font-weight: normal; } #match th { color: var(--dim); font-size: 11px; }
#match td:first-child, #match th:first-child { text-align: left; } #match tr.view { cursor: pointer; } #match tr.view:hover { background: #252a35; } #match tr.mean td { border-top: 1px solid var(--line); font-weight: 600; } #match td.target { color: var(--text); font-weight: 600; } #match td.ok { color: var(--ok); }
#match tr.flag td:first-child::after { content: ' ⚠'; color: var(--bad); }
#match .small { font-size: 12px; } #match progress { width: 100%; height: 6px; } #match label { display: grid; grid-template-columns: 78px 1fr 40px; gap: 6px; align-items: center; margin: 4px 0; } #match label input[type=number], #match label select { grid-column: 2 / 4; width: 100%; } #match input[type=range] { padding: 0; accent-color: var(--accent); }
#match .loop { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 4px; } #match p { margin: 4px 0; }
.rounds { font-variant-numeric: tabular-nums; } .stop { color: var(--ok); } .stop.held-back, .stop.out-of-rounds, .stop.plateau { color: var(--accent); }
#refGrip { position: absolute; left: -4px; top: 0; bottom: 0; width: 8px; cursor: col-resize; z-index: 2; touch-action: none; } #refGrip:hover, #refGrip.drag { background: var(--accent); opacity: .5; }
</style>
</head>
<body>
<header><h1>Model review</h1><span class="grow"></span></header>
<aside id="left"><button id="newModel" class="primary" hidden title="Describe a model, approve a concept image and its views">＋ New model</button><input id="filter" placeholder="filter models" autocomplete="off"><div id="drafts"></div><div id="models" class="dim">loading…</div></aside>
<main>
 <div id="main">
  <canvas id="view"></canvas>
  <div id="toolbar" hidden>
    <button id="pinMode" title="Pin mode (P): click the model to drop a pin; drag a pin to move it">📍 Pin</button>
    <button id="resetView" title="Frame the whole model">Reset view</button>
    <select id="lighting" title="Lighting"><option value="studio">Studio</option><option value="space">Dark space</option></select>
    <select id="shading" title="Shading: Textured (maps and project materials), Clay (neutral grey), or Vertex mask (raw COLOR_0)">
      <option value="textured">Textured</option>
      <option value="clay">Clay</option>
      <option value="mask">Vertex mask</option>
    </select>
    <button id="wire" title="Wireframe">Wire</button>
    <button id="colliders" title="Show collision meshes (*-colonly)" hidden>Colliders</button>
    <button id="gridBtn" title="The floor grid (the same switch as the map's grid)">Grid</button>
    <button id="statsBtn" title="Model dimensions, geometry, materials and textures">Stats</button>
    <button id="matsBtn" title="Inspect and tint individual material slots">Materials</button>
  </div>
  <div id="inspectDock">
    <section id="statsPanel" class="hud-card" hidden>
      <div class="hud-head"><h2>Model stats</h2><button id="statsClose" title="Close">×</button></div>
      <table id="statsTable"></table>
    </section>
    <section id="matsPanel" class="hud-card" hidden>
      <div class="hud-head"><h2 id="matsHead">Materials</h2><button id="matsReset" hidden title="Restore original materials">Reset</button><button id="matsClose" title="Close">×</button></div>
      <div id="matsList" class="dim">Open a model.</div>
    </section>
  </div>
  <div id="bottomDock">
    <div id="modelRefs" hidden><h2 id="refsHead" title="The images this model was made from. Click to fold">References</h2><div class="strip" id="refStrip"></div></div>
    <div id="animBar" hidden>
      <button id="animPlay" title="Play / Pause (Space)">▶</button>
      <button id="animStop" title="Rewind to start">⏹</button>
      <select id="animClip" title="Animation clip"></select>
      <input id="animScrub" type="range" min="0" max="1" step="0.001" value="0" title="Scrub timeline">
      <span id="animTime">0.00 / 0.00s</span>
      <select id="animSpeed" title="Playback speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select>
      <button id="animLoop" class="on" title="Loop playback">↻</button>
    </div>
  </div>
  <div id="status" class="dim"></div>
  <div id="overlay"><div id="overlayBody"></div></div>
 </div>
 <div id="refPanel" hidden>
  <div id="refGrip" title="Drag to resize"></div>
  <div class="bar"><b id="refName"></b><span id="refCount" class="dim"></span><span class="grow"></span>
   <button id="refPrev" title="Previous reference (←)">‹</button><button id="refNext" title="Next reference (→)">›</button><button id="refClose" title="Close (Esc)">×</button></div>
  <div class="pic"><figure><img id="refImg" alt="" title="Click to see it at full size"><figcaption id="refCap" hidden></figcaption></figure>
   <figure id="refOverlayBox" hidden><img id="refOverlay" alt="" title="Click to see it at full size"><figcaption>the model's outline (yellow) · red: only the reference has it · blue: only the model has it</figcaption></figure></div>
 </div>
</main>
<aside id="right">
  <h2 id="matchHead">Match with its references</h2>
  <div id="match">
    <p id="matchNote" class="dim">Open a model.</p>
    <p><button id="matchBtn" hidden title="Render the model from the reference angles and compare it with the references: silhouette, colour, and whether the references agree with each other">Measure</button> <span id="matchProg" class="dim"></span></p>
    <progress id="matchBar" hidden max="1" value="0"></progress>
    <table id="matchTable" hidden></table>
    <div id="matchWarn" class="bad small"></div>
    <div id="matchLoop" class="loop" hidden>
      <label title="The loop stops when the mean score reaches this">Target <input id="mTarget" type="range" min="0.5" max="0.99" step="0.01" value="0.9"><output id="mTargetOut">0.90</output></label>
      <label title="At most this many rounds of fixing and scoring">Max rounds <input id="mRounds" type="number" min="1" max="20" step="1" value="5"></label>
      <label title="Stop early when a round improves the mean by less than this. Empty: never">Stop below <input id="mPlateau" type="number" min="0" max="0.2" step="0.005" value="0.01" placeholder="off"></label>
      <label title="Which score the target is about">Score <select id="mScore"><option value="combined">Combined (silhouette and colour)</option><option value="silhouette">Silhouette only</option></select></label>
      <p><button id="improve" class="primary" disabled title="Sends a job that rebuilds the model, re-measures and repeats until the target, with the workflow chosen below">Improve to target</button> <span id="improveState" class="dim"></span></p>
    </div>
  </div>
  <h2>Pins</h2><div id="pins" class="dim">Open a model, then use 📍 Pin (P).</div>
  <h2>Note</h2><textarea id="note" placeholder="What is wrong overall (optional)"></textarea>
  <h2>Workflow</h2><select id="workflow"></select>
  <p id="warn" class="bad"></p>
  <p><button class="primary" id="send" disabled>Send to Claude</button> <span id="sendState" class="dim"></span></p>
  <h2 id="jobsHead">Jobs</h2><div id="jobs" class="dim">none yet</div>
</aside>
<div id="zoom"><img alt="reference image"></div>
<script src="/shell/lend.js"></script>
<script src="/shell/grid.js"></script>
<script src="/shell/tree.js"></script>
<script type="module">
// The model viewer: a game's .glb files beside the images they were made from, pins with notes and reference images, and Send, which writes a review job
// for a Claude Code session (see the README, "Model review"). three.js is installed on demand from the Install button.
// in the workbench, the model list is lent to its side panel: look there too
document.head.append(Object.assign(document.createElement('style'), { textContent: nfTree.css }));   // before the column is lent: it takes the page's styles along
// In the workbench the page keeps the model and its toolbar: the model list is lent to the side panel, the review
// (pins, note, workflow, Send) to the Inspector, and the review jobs to the bottom panel as "Reviews".
const embedded = window.top !== window;
if (embedded) {
  const byId = (id) => document.getElementById(id), right = byId('right'), div = (id) => Object.assign(document.createElement('div'), { id });
  document.body.classList.add('framed');
  const review = div('review'), reviews = div('reviews');
  review.append(...[...right.children].filter((e) => e.id !== 'jobs' && e.id !== 'jobsHead')); reviews.append(byId('jobs'));
  right.append(review, reviews);
}
const panel = embedded ? nfLend({ side: { el: document.getElementById('left'), title: 'Model viewer', css: '#left { padding: 10px; }' },
  inspector: { el: document.getElementById('review'), title: 'Review' }, bottom: { el: document.getElementById('reviews'), title: 'Reviews', key: 'reviews' } }) : null;
const $ = (id) => document.getElementById(id) || (panel && panel.byId(id));
const el = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); for (const k of kids) e.append(k); return e; };
const api = async (path, options) => { const r = await fetch(path, options), j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || `${r.status} ${r.statusText}`); return j; };
const post = (path, body) => api(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
const say = (text, cls = 'dim') => { $('status').className = cls; $('status').textContent = text; };
const round = (v) => Math.round(v * 1e4) / 1e4;
const MB = 1024 * 1024;

// state
let info, T, scene, camera, renderer, controls, loader, fbxLoader, ktx2Loader, texLoader, envTexture, key, ray, ndc;
let model = null, modelPath = null, modelMeta = null, models = [], pinMode = false, wire = false, shading = 'textured', preferredShading = null, showColliders = false, saveTimer = null, pollTimer = null, loadToken = 0;
let matLib = { sets: {}, plain: {} }, clayMat = null, clayMatDouble = null, ghostMat = null, ghostMatDouble = null;
let mixer = null, clips = [], activeAction = null, activeClip = -1, animPlaying = false, animSpeed = 1, animLoop = true, lastFrameMs = 0;
let matSlots = [], soloSlot = -1, modelStats = null;
const texCache = new Map();                            // "set/file:srgb" → Promise<THREE.Texture | null>
let draft = { note: '', workflow: 'auto', pins: [] }; // a pin: { position, normal, mesh, material, uv, camera, screenshot, note, refs: [data URL] }
const markers = [];                                    // a sprite per draft pin (in order), then the sent ones
const sent = new Map();                                // job id → { model, positions }: greyed pins until the job finishes
let refs = [], refAt = -1;                             // the model's own reference images ([{ name, size, mtime }]) and the one shown large (-1: none)

// ---- drafts, one per model, in IndexedDB (images make them too big for localStorage)
const db = await new Promise((done, fail) => { const r = indexedDB.open('model-review', 1); r.onupgradeneeded = () => r.result.createObjectStore('drafts'); r.onsuccess = () => done(r.result); r.onerror = () => fail(r.error); });
const idb = (mode, fn) => new Promise((done, fail) => { const t = db.transaction('drafts', mode), req = fn(t.objectStore('drafts')); t.oncomplete = () => done(req.result); t.onerror = () => fail(t.error); });
const loadDraft = (path) => idb('readonly', (s) => s.get(path));
const clearDraft = (path) => idb('readwrite', (s) => s.delete(path));
function saveDraft() {
  if (!modelPath) return;
  clearTimeout(saveTimer);
  const path = modelPath, copy = JSON.parse(JSON.stringify(draft));
  saveTimer = setTimeout(() => idb('readwrite', (s) => s.put(copy, path)).catch((e) => say(`draft not kept: ${e.message}`, 'bad')), 300);
}

// ---- three.js missing: the Install button
function showInstall() {
  const btn = el('button', { className: 'primary', textContent: `Install three.js ${info.three.version}` });
  const msg = el('p', { textContent: `The viewer draws models with three.js, which does not come with the editor. Install downloads three ${info.three.version} (${(info.three.size / MB).toFixed(1)} MB) from the npm registry, checks it against its pinned SHA-512, and keeps only the files the viewer needs, in the editor's vendor/ folder.` });
  btn.onclick = async () => {
    btn.disabled = true; btn.textContent = 'Installing…';
    try { await post('/api/vendor/install', {}); location.reload(); } catch (e) { btn.disabled = false; btn.textContent = 'Try again'; msg.className = 'bad'; msg.textContent = `Not installed: ${e.message}`; }
  };
  $('overlayBody').replaceChildren(el('h2', { textContent: 'three.js is not installed' }), msg, btn);
}

// ---- the 3D view
async function startThree() {
  const base = info.three.base;
  T = await import('three');
  const [{ OrbitControls }, { GLTFLoader }, { FBXLoader }, { DRACOLoader }, { KTX2Loader }, { MeshoptDecoder }, { RoomEnvironment }] = await Promise.all([
    import('three/addons/controls/OrbitControls.js'), import('three/addons/loaders/GLTFLoader.js'), import('three/addons/loaders/FBXLoader.js'),
    import('three/addons/loaders/DRACOLoader.js'), import('three/addons/loaders/KTX2Loader.js'),
    import('three/addons/libs/meshopt_decoder.module.js'), import('three/addons/environments/RoomEnvironment.js')]);
  renderer = new T.WebGLRenderer({ canvas: $('view'), antialias: true, preserveDrawingBuffer: true }); // keeps frames for screenshots
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.toneMapping = T.ACESFilmicToneMapping;
  scene = new T.Scene();
  camera = new T.PerspectiveCamera(45, 1, 0.01, 1e5); camera.position.set(4, 3, 6);
  controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping = true;
  envTexture = new T.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;

  const cv = renderer.domElement; let down = null, dragging = -1;
  cv.addEventListener('pointerdown', (e) => {
    if (!model || e.button !== 0) return;
    down = { x: e.clientX, y: e.clientY };
    const i = hitMarker(e);
    if (i >= 0) { dragging = i; controls.enabled = false; cv.setPointerCapture(e.pointerId); }
  });
  cv.addEventListener('pointermove', (e) => {
    if (dragging < 0) return;
    const h = hitModel(e); if (!h) return;
    Object.assign(draft.pins[dragging], describeHit(h)); markers[dragging].position.fromArray(draft.pins[dragging].position);
  });
  cv.addEventListener('pointerup', (e) => {
    const moved = !!down && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 4; down = null;
    if (dragging >= 0) { const i = dragging; dragging = -1; controls.enabled = true; if (moved) { draft.pins[i].camera = camState(); draft.pins[i].screenshot = capture(i); drawPins(); saveDraft(); } else focusPin(i); return; }
    if (pinMode && !moved && model) { const h = hitModel(e); if (h) addPin(h); }
  });
  $('pinMode').onclick = () => setPinMode(!pinMode);
  addEventListener('keydown', (e) => {
    if (e.target.closest('textarea, input, select')) return;
    if (e.key === 'p' || e.key === 'P') setPinMode(!pinMode);
    if (e.key === 'Escape') setPinMode(false);
    if (e.key === ' ' && activeAction) { e.preventDefault(); setAnimPlaying(!animPlaying); }
  });
  $('resetView').onclick = () => model && frame();
  $('lighting').onchange = (e) => setLighting(e.target.value);
  $('shading').onchange = (e) => setShading(e.target.value, { byUser: true });
  $('wire').onclick = () => setWire(!wire);
  $('colliders').onclick = () => setColliders(!showColliders);
  $('gridBtn').onclick = () => nfGrid.toggle();
  $('statsBtn').onclick = () => setHudPanel('stats', $('statsPanel').hidden);
  $('statsClose').onclick = () => setHudPanel('stats', false);
  $('matsBtn').onclick = () => setHudPanel('mats', $('matsPanel').hidden);
  $('matsClose').onclick = () => setHudPanel('mats', false);
  $('matsReset').onclick = resetMaterials;
  setHudPanel('stats', keep.get('viewer-stats-open') === '1');
  setHudPanel('mats', keep.get('viewer-mats-open') === '1');
  $('animPlay').onclick = () => setAnimPlaying(!animPlaying);
  $('animStop').onclick = () => { setAnimPlaying(false); scrubAnim(0); };
  $('animClip').onchange = (e) => selectClip(Number(e.target.value), { play: animPlaying });
  $('animScrub').oninput = (e) => scrubAnim(Number(e.target.value));
  $('animSpeed').onchange = (e) => { animSpeed = Number(e.target.value) || 1; };
  $('animLoop').onclick = () => {
    animLoop = !animLoop;
    if (activeAction) { activeAction.setLoop(animLoop ? T.LoopRepeat : T.LoopOnce, Infinity); activeAction.clampWhenFinished = true; }
    syncAnimUI();
  };
}
async function shrink(file) { // at most 2048 px on the long side; PNG when it has transparency, else JPEG
  const bmp = await createImageBitmap(file), k = Math.min(1, 2048 / Math.max(bmp.width, bmp.height));
  const c = el('canvas', { width: Math.round(bmp.width * k), height: Math.round(bmp.height * k) }), g = c.getContext('2d');
  g.drawImage(bmp, 0, 0, c.width, c.height);
  let alpha = false;
  if (file.type !== 'image/jpeg') { const d = g.getImageData(0, 0, c.width, c.height).data; for (let i = 3; i < d.length; i += 4) if (d[i] < 255) { alpha = true; break; } }
  return alpha ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', 0.9);
}
function zoom(src) { $('zoom').querySelector('img').src = src; $('zoom').style.display = 'grid'; }
function drawPins() {
  const box = $('pins');
  if (!model) return;
  if (!draft.pins.length) { box.className = 'dim'; box.textContent = 'No pins. Use 📍 Pin (P) and click the model.'; return; }
  box.className = '';
  box.replaceChildren(...draft.pins.map((p, i) => {
    const note = el('textarea', { value: p.note, placeholder: 'What is wrong here? Drop or paste reference images.' });
    note.oninput = () => { p.note = note.value; saveDraft(); };
    const take = async (files) => {
      for (const f of files) {
        if (!/^image\/(png|jpeg|webp)$/.test(f.type)) { say(`${f.name || 'that file'}: only PNG, JPEG or WebP`, 'bad'); continue; }
        if (p.refs.length >= 4) { say('at most 4 reference images per pin', 'bad'); break; }
        p.refs.push(await shrink(f));
      }
      drawPins(); saveDraft();
    };
    const refs = el('div', { className: 'refs' }, ...p.refs.map((src, j) => el('figure', {},
      el('img', { src, alt: `reference ${j + 1}`, onclick: () => zoom(src) }),
      el('button', { textContent: '×', title: 'Remove', onclick: () => { p.refs.splice(j, 1); drawPins(); saveDraft(); } }))));
    const card = el('div', { className: 'pin' },
      el('div', { className: 'head' }, el('span', { className: 'num', textContent: i + 1 }), el('span', { className: 'where', textContent: [p.mesh, p.material].filter(Boolean).join(' · ') || 'surface', title: `at ${p.position.join(', ')}` }),
        el('button', { textContent: 'View', onclick: () => focusPin(i) }),
        el('button', { textContent: 'Delete', onclick: () => { draft.pins.splice(i, 1); rebuildMarkers(); drawPins(); saveDraft(); updateSend(); } })),
      note, refs);
    card.addEventListener('dragover', (e) => { e.preventDefault(); card.classList.add('drop'); });
    card.addEventListener('dragleave', () => card.classList.remove('drop'));
    card.addEventListener('drop', (e) => { e.preventDefault(); card.classList.remove('drop'); take([...e.dataTransfer.files]); });
    note.addEventListener('paste', (e) => { const files = [...e.clipboardData.files]; if (files.length) { e.preventDefault(); take(files); } });
    return card;
  }));
}

// ---- match: how well the model agrees with its references (see the README, "Matching a model to its references")
// The scorer runs in Blender on the server, in the background; this page asks for it and polls how far it is.
let matchState = null, matchTimer = null, matchSaveTimer = null;
const f2 = (v) => (typeof v === 'number' ? v.toFixed(2) : '–');
const SCORE_NAMES = { silhouette: 'Silhouette', colour: 'Colour', combined: 'Combined' };
const VIEW_ORDER = ['front', 'back', 'left', 'right', 'top', 'bottom'];
const matchResult = () => (matchState && matchState.state === 'done' ? matchState.result : null);
const viewOfRef = (r) => { const v = refLabel(r).toLowerCase(); return VIEW_ORDER.includes(v) ? v : null; };
const loopSettings = () => ({ target: Math.round(Number($('mTarget').value) * 100) / 100, maxRounds: Math.round(Number($('mRounds').value)), plateau: $('mPlateau').value === '' ? null : Number($('mPlateau').value), score: $('mScore').value });
function setLoopControls(v) { $('mTarget').value = v.target; $('mTargetOut').textContent = f2(v.target); $('mRounds').value = v.maxRounds; $('mPlateau').value = v.plateau === null ? '' : v.plateau; $('mScore').value = v.score; }
function saveLoop() { clearTimeout(matchSaveTimer); matchSaveTimer = setTimeout(() => { post('/api/match/settings', loopSettings()).catch(() => { /* an out-of-range field: the next valid value is kept */ }); }, 400); drawMatch(); }
async function loadMatch(path) {
  clearTimeout(matchTimer);
  try { const s = await api(`/api/model/match?path=${encodeURIComponent(path)}`); if (path !== modelPath) return; matchState = s; } catch (e) { if (path !== modelPath) return; matchState = { state: 'error', error: e.message }; }
  drawMatch(); drawRefScores(); showOverlay();
  if (matchState.state === 'running') matchTimer = setTimeout(() => loadMatch(path), 1000);
}
async function startMatch() {
  $('matchBtn').disabled = true;
  try { matchState = await post('/api/model/match', { path: modelPath }); drawMatch(); matchTimer = setTimeout(() => loadMatch(modelPath), 700); }
  catch (e) { matchState = { ...(matchState || {}), state: 'failed', error: e.message }; drawMatch(); }
}
function drawMatch() {
  const s = matchState, ok = matchResult(), loop = $('matchLoop'), note = $('matchNote'), btn = $('matchBtn');
  const clear = () => { $('matchTable').hidden = true; $('matchBar').hidden = true; $('matchProg').textContent = ''; $('matchWarn').textContent = ''; loop.hidden = true; btn.hidden = true; };
  if (!model || !s) { clear(); note.className = 'dim'; note.textContent = model ? 'Looking at its references…' : 'Open a model.'; return; }
  note.className = 'dim';
  if (s.state === 'error') { clear(); note.className = 'bad'; note.textContent = s.error; return; }
  if (s.state === 'unsupported') { clear(); note.textContent = s.error || 'Reference matching runs on .glb models.'; return; }
  if (s.state === 'no-views') { clear(); note.textContent = 'To measure this model against its references, put images named front, back, left, right, top or bottom in its .refs folder (see References). Concept and three-quarter images are shown, not scored.'; return; }
  btn.hidden = false;
  note.textContent = `Renders the model from ${s.views.join(', ')} and compares each with its reference.`;
  if (!s.blender.found) { note.className = 'bad'; note.textContent = s.blender.text; }
  btn.disabled = s.state === 'running' || !s.blender.found; btn.textContent = ok ? 'Measure again' : 'Measure';
  btn.title = ok ? 'The model has not changed since this was measured: the same scores come back at once' : btn.title;
  $('matchBar').hidden = s.state !== 'running';
  if (s.state === 'running') { $('matchBar').max = Math.max(1, s.progress.total); $('matchBar').value = s.progress.done; $('matchProg').textContent = s.progress.text; }
  else $('matchProg').textContent = s.state === 'failed' ? '' : '';
  const warn = [];
  if (s.state === 'failed') warn.push(s.error);
  const table = $('matchTable');
  if (ok) {
    const key = loopSettings().score, want = Number($('mTarget').value);
    const rows = VIEW_ORDER.filter((v) => ok.views[v]).map((v) => {
      const x = ok.views[v], flag = ok.consistency && ok.consistency.flagged.includes(v);
      const cell = (k) => el('td', { className: `${k === key ? 'target' : ''} ${x[k] >= want ? 'ok' : ''}`, textContent: f2(x[k]) });
      return el('tr', { className: `view${flag ? ' flag' : ''}`, title: flag ? 'This reference disagrees with the others' : `Open the ${v} reference beside its overlay`, onclick: () => { const i = refs.findIndex((r) => viewOfRef(r) === v); if (i >= 0) showRef(i); } }, el('td', { textContent: v }), cell('silhouette'), cell('colour'), cell('combined'));
    });
    const mean = (k) => el('td', { className: `${k === key ? 'target' : ''} ${ok.mean[k] >= want ? 'ok' : ''}`, textContent: f2(ok.mean[k]) });
    table.replaceChildren(el('tr', {}, el('th'), ...Object.values(SCORE_NAMES).map((t) => el('th', { textContent: t }))), ...rows, el('tr', { className: 'mean' }, el('td', { textContent: 'mean' }), mean('silhouette'), mean('colour'), mean('combined')));
    table.hidden = false;
    const o = ok.orientation; if (o.turn || o.up !== '+Y') warn.push(`The model is ${o.up !== '+Y' ? `lying with ${o.up} up and ` : ''}turned ${o.turn}° about its up axis from the references: scored as turned back.`);
    for (const w of ok.warnings || []) warn.push(w.text);
    for (const w of (ok.consistency && ok.consistency.warnings) || []) warn.push(w);
    if (ok.consistency && !ok.consistency.checked) { /* fewer than three views: nothing to compare */ }
  } else table.hidden = true;
  $('matchWarn').replaceChildren(...warn.map((t) => el('div', { textContent: `⚠ ${t}` })));
  loop.hidden = !ok; $('improve').disabled = !ok || !model;
  if (ok) $('matchHead').textContent = `Match with its references · ${f2(ok.mean[loopSettings().score])}`; else $('matchHead').textContent = 'Match with its references';
}
// each reference's score under its thumbnail, and the model's outline over it in the large panel
function drawRefScores() {
  const ok = matchResult(); if (!$('refStrip')) return;
  [...$('refStrip').children].forEach((b, i) => { const v = refs[i] && viewOfRef(refs[i]), x = ok && v && ok.views[v], span = b.querySelector('span'); if (span) span.textContent = x ? `${refLabel(refs[i])} ${f2(x.combined)}` : refLabel(refs[i]); });
}
function showOverlay() {
  const ok = matchResult(), r = refAt >= 0 ? refs[refAt] : null, v = r && viewOfRef(r), x = ok && v && ok.views[v];
  $('refOverlayBox').hidden = !x; $('refCap').hidden = !x;
  if (!x) { $('refOverlay').removeAttribute('src'); return; }
  $('refCap').textContent = `reference · ${v} · silhouette ${f2(x.silhouette)} · colour ${f2(x.colour)}`;
  $('refOverlay').src = `/api/model/match/image?key=${ok.key}&name=${encodeURIComponent(x.overlay)}`; $('refOverlay').alt = `${v}: the model's outline over the reference`;
}
$('matchBtn').onclick = startMatch;
for (const id of ['mTarget', 'mRounds', 'mPlateau', 'mScore']) $(id).oninput = () => { $('mTargetOut').textContent = f2(Number($('mTarget').value)); saveLoop(); };
$('improve').onclick = () => send({ match: true });

// ---- send, and the jobs
function updateSend() { $('send').disabled = !model || (!draft.pins.length && !draft.note.trim()); }
async function send({ match = false } = {}) {
  const btn = $(match ? 'improve' : 'send'), said = $(match ? 'improveState' : 'sendState'); btn.disabled = true; said.textContent = 'sending…';
  const job = { model: modelPath, note: draft.note, workflow: $('workflow').value, overview: screenshot(), ...(match ? { match: loopSettings() } : {}),
    pins: draft.pins.map((p) => ({ note: p.note, position: p.position, normal: p.normal, mesh: p.mesh, material: p.material, uv: p.uv, camera: p.camera, screenshot: p.screenshot, refs: p.refs })) };
  const size = JSON.stringify(job).length;
  if (size > 23.5 * MB) { said.textContent = `too big (${(size / MB).toFixed(1)} MB of 24): remove some reference images`; btn.disabled = false; return; }
  try {
    const { id } = await post('/api/review', job);
    sent.set(id, { model: modelPath, positions: draft.pins.map((p) => p.position) });
    await clearDraft(modelPath);
    draft = { note: '', workflow: job.workflow, pins: [] }; $('note').value = '';
    rebuildMarkers(); drawPins(); updateSend();
    said.textContent = `sent: ${id}`; pollJobs(); drawMatch();
  } catch (e) { said.textContent = ''; say(`not sent (your pins are kept): ${e.message}`, 'bad'); btn.disabled = false; updateSend(); drawMatch(); }
}
async function pollJobs() {
  clearTimeout(pollTimer);
  try {
    const { reviews } = await api('/api/reviews');
    drawJobs(reviews);
    for (const j of reviews) if (sent.has(j.id) && (j.state === 'done' || j.state === 'failed')) { sent.delete(j.id); if (T) rebuildMarkers(); }
  } catch { /* the editor may be restarting: the next poll tries again */ }
  pollTimer = setTimeout(pollJobs, 3000);
}
const STOPS = { 'target-reached': 'Target reached', 'out-of-rounds': 'Out of rounds', plateau: 'Stopped: no longer improving', 'held-back': 'Held back by inconsistent references' };
function drawJobs(reviews) {
  const queued = reviews.filter((j) => j.state === 'queued'), oldest = queued.length ? Math.min(...queued.map((j) => Date.parse(j.createdAt))) : null;
  $('warn').textContent = oldest && Date.now() - oldest > 120000 ? 'No Claude session seems to be watching. In your terminal, say "watch the review inbox". Jobs stay queued until then.' : '';
  const box = $('jobs');
  if (!reviews.length) { box.className = 'dim'; box.textContent = 'none yet'; return; }
  box.className = '';
  box.replaceChildren(...reviews.slice(0, 20).map((j) => {
    const kids = [el('div', {}, el('span', { className: `state ${j.state}`, textContent: j.state }), ' ', el('span', { textContent: j.model || j.id }), el('span', { className: 'dim', textContent: ` · ${j.pins} pin${j.pins === 1 ? '' : 's'}${j.workflow ? ` · ${j.workflow}` : ''}` }))];
    if (j.match) {
      const last = j.rounds[j.rounds.length - 1], means = j.rounds.map((r) => f2(r.mean)).join(' → ');
      kids.push(el('div', { className: 'rounds', textContent: `${SCORE_NAMES[j.match.score]} target ${f2(j.match.target)} · ${last ? `round ${last.round}/${j.match.maxRounds}: ${means}` : 'not started'}`, title: j.rounds.map((r) => `round ${r.round}: ${f2(r.mean)}${r.note ? ` · ${r.note}` : ''}${r.unchanged ? ' · the model file had not changed' : ''}${r.flagged.length ? ` · references off: ${r.flagged.join(', ')}` : ''}${r.drift && r.drift.length ? ` · drifted: ${r.drift.join('; ')}` : ''}`).join('\n') }));
      if (j.stopReason) kids.push(el('div', { className: `stop ${j.stopReason}`, textContent: `${STOPS[j.stopReason]}${j.stopDetail ? ` — ${j.stopDetail}` : ''}` }));
    }
    if (j.summary) kids.push(el('div', { textContent: j.summary }));
    if (j.question) kids.push(el('div', { className: 'bad', textContent: `Question: ${j.question}` }));
    if (j.state === 'done' && j.modelChanged && j.model === modelPath) kids.push(el('button', { textContent: 'Reload model', onclick: async () => { await listModels(); const m = models.find((x) => x.path === j.model); if (m) { await openModel(m, { keepCamera: true }); } } }));
    return el('div', { className: 'job', title: j.id }, ...kids);
  }));
}

// ---- start
$('filter').oninput = drawModelList;
$('note').oninput = () => { draft.note = $('note').value; saveDraft(); updateSend(); };
$('workflow').onchange = () => { draft.workflow = $('workflow').value; saveDraft(); };
$('send').onclick = send;
$('zoom').onclick = () => { $('zoom').style.display = 'none'; };
wireRefs();
info = await api('/api/viewer');
try { matLib = await api('/api/materials'); } catch { matLib = { sets: {}, plain: {} }; }
setLoopControls(info.match.last); Object.assign($('mTarget'), { min: info.match.limits.target.min, max: info.match.limits.target.max, step: info.match.limits.target.step }); $('mTarget').value = info.match.last.target;
document.title = `${info.title ? `${info.title}: ` : ''}model review`;
for (const w of info.workflows) $('workflow').append(el('option', { value: w.id, textContent: w.enabled ? w.label : `${w.label} (not set up yet)`, disabled: !w.enabled, title: w.description }));
if (info.three.installed) await startThree(); else showInstall();
await listModels();
// a link from before names a model from the models folder (where New model writes, and what the palette offers): that
// one opens; failing that, the one model whose path ends with it
const want = new URLSearchParams(location.search).get('model'), ends = want ? models.filter((x) => x.path.endsWith(`/${want}`)) : [];
const first = want && (models.find((x) => x.path === want) || models.find((x) => x.path === `${info.modelsFolder}/${want}`) || (ends.length === 1 ? ends[0] : null));
if (want && !first) say(`no such model: ${want}${ends.length > 1 ? ` (${ends.length} models end with it)` : ''}. Pick one on the left.`, 'bad');
if (first && T) await openModel(first);
pollJobs();
window.__viewer = {
  get ready() { return !!T; },
  get modelPath() { return modelPath; },
  get stats() { return modelStats; },
  get clips() { return clips.map((c) => ({ name: c.name, duration: c.duration })); },
  get anim() { return { playing: animPlaying, clip: activeClip, time: activeAction ? activeAction.time : 0, speed: animSpeed, loop: animLoop }; },
  get materials() { return matSlots.map((s) => ({ name: s.name, tris: s.tris, tint: s.tint, baseColor: s.baseColor, solo: soloSlot === s.index })); },
  open: (path) => { const m = models.find((x) => x.path === path); return m ? openModel(m) : null; },
};
</script>
